name: hub-check
# Gate every change to this hub: data-only paths, no deletions, append-only ledgers,
# per-signer log ownership, valid signatures, blob hashes. Signer TRUST is deliberately
# not decided here: that stays with each maintainer's local peers.json at `commons pull`.
#
# pull_request_target (not pull_request) so a PR cannot edit this file to neuter its own
# check: the workflow ALWAYS comes from the base branch. That is safe here because PR
# content is only ever READ as data by the tool (checked out from the tool repo, never
# from the PR); nothing from the PR is executed, and credentials are not persisted.
# The authoritative gate remains `commons pull` on a maintainer's machine.
on:
  pull_request_target:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    # The tool repo (shabbydev/research-commons) is private, so checking it out needs a
    # read-only deploy key as COMMONS_TOOL_DEPLOY_KEY. A deploy key can only be created by
    # the OWNER of the tool repo, which the maintainer of this hub is not — so this gate
    # cannot be made to pass from here, and a hub run by anyone but the tool's author will
    # hit the same wall. Skipping rather than failing: a permanently red main that nobody
    # can fix locally is worse than an honest skip, and `main` is deliberately NOT protected
    # with this as a required status check for the same reason.
    #
    # The authoritative gate is `commons hub check` + `commons fsck --availability` run
    # locally before every `commons push`, which is what actually guards this hub today.
    # This job starts working by itself the day the secret exists or the tool repo goes
    # public; nothing else needs changing.
    if: vars.COMMONS_TOOL_PUBLIC == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: checkout hub (PR head as DATA only)
        uses: actions/checkout@v4
        with:
          path: hub
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: checkout tool
        uses: actions/checkout@v4
        with:
          repository: shabbydev/research-commons
          ref: main
          path: tool
          persist-credentials: false
          # Only needed while the tool repo is private: the private half of a read-only
          # deploy key on the tool repo, stored as this hub's COMMONS_TOOL_DEPLOY_KEY secret.
          ssh-key: ${{ secrets.COMMONS_TOOL_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: cd tool && npm install --no-audit --no-fund --ignore-scripts
      - name: commons hub check
        working-directory: hub
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            ../tool/bin/commons hub check
          else
            ../tool/bin/commons hub check --base "$BASE"
          fi
